---
name: Promote main to stable

# Two-branch model: `main` is the testing branch (publishes :stable-testing),
# `stable` is the production branch (publishes :stable). On every push to
# `main` the shared factory workflow opens (or refreshes) a squash promotion
# PR from `main` to `stable`; merging it publishes :stable.
#
# Reusable logic lives in projectbluefin/actions — this is a thin caller,
# matching the pattern in projectbluefin/bluefin and projectbluefin/bluefin-lts.
# pull[bot] was considered and rejected: the factory reusable is auditable,
# org-maintained, and shared with the other image repos (see issues #235/#237).

on:
  # Promote only after the image the release gate inspects actually exists.
  # The gate resolves ghcr.io/<owner>/<image>:testing, which build-image.yml
  # publishes at the very end of a ~20 minute build. Triggering on push raced
  # that build, so the gate always saw a missing or stale digest and labelled
  # the promotion PR release/blocked.
  workflow_run:
    workflows: ["Build and Push Image"]
    types:
      - completed
  # Pushes that build-image.yml ignores never produce a workflow_run, so mirror
  # its paths-ignore here. For a docs-only change the existing signed :testing
  # image is still the correct artifact to gate on.
  push:
    branches:
      - main
    paths:
      - "**.md"
      - ".github/workflows/*validate*.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  packages: read
  pull-requests: write
  statuses: write

concurrency:
  group: promote-main-to-stable
  cancel-in-progress: false

jobs:
  promote:
    name: Promote main to stable
    # build-image.yml also runs on stable, and a failed build must not promote.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    uses: projectbluefin/actions/.github/workflows/reusable-promote-squash.yml@e2ccd51b41d9bb3abd9caeac626fb15c95589c3c # v1
    with:
      variants: >-
        [{"image":"${{ github.event.repository.name }}"}]
      cosign_identity_regexp: >-
        ^https://github\.com/${{ github.repository_owner }}/[^/]+/\.github/workflows/
      registry: ghcr.io/${{ github.repository_owner }}
      source_branch: main
      target_branch: stable
      # The release gate resolves the :testing tag (published by main builds)
      # and verifies its cosign signature. Enable the OPTIONAL keyless signing
      # step in build-image.yml for the gate to report release/ready.
      #
      # KNOWN GAP (see #281): run_e2e is false because finpilot has no
      # post-build/post-merge E2E workflow and no e2e_image configured for
      # the shared gate to exercise. Stable promotion is therefore gated on
      # digest + cosign signature checks only, not on functional E2E
      # validation. This is an intentional, documented release risk (see
      # README.md "Promote to Stable") until an E2E workflow and
      # `e2e_image`/`e2e_suites` inputs are added here.
      run_e2e: false
      # This fork is owned by a user account, not an org, so the reusable
      # workflow's default reviewer (<owner>/maintainers team) does not exist
      # and the review request would fail.
      request_reviewer: false
    secrets: inherit
